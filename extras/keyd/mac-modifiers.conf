# Put Super (⌘) next to Space on a PC keyboard, where Command sits on a Mac.
#
# Swaps Left Alt and the left Windows key on every keyboard keyd sees. Leave it
# out for an Apple keyboard, which already has Command beside Space.
#
#   sudo cp mac-modifiers.conf /etc/keyd/default.conf
#   sudo systemctl enable --now keyd
#
# Narrow [ids] to one keyboard with `keyd monitor`, which prints each device's
# vendor:product id.

[ids]
*

[main]
leftalt = leftmeta
leftmeta = leftalt
